# Weekly individual Python updates; GitHub Actions remain grouped for manual review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Matches MIN_RELEASE_AGE in scripts/dependabot_review.py.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
