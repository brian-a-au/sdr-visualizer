name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry run: every gate, the build, and the installed-artifact smoke run, but
  # publish (and so github-release) is skipped.
  workflow_dispatch:

jobs:
  browser-perf:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --dev --group browser

      - name: Verify Python runtime
        run: |
          uv run python - <<'PYTHON'
          import os
          import sys

          expected = tuple(map(int, os.environ["UV_PYTHON"].split(".")))
          actual = sys.version_info[:2]
          print(f"Requested Python {os.environ['UV_PYTHON']}; running {sys.version}", flush=True)
          if actual != expected:
              raise SystemExit(f"Python version mismatch: expected {expected}, got {actual}")
          PYTHON

      - name: Install browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Generate fixtures
        run: |
          uv run python scripts/generate_large_fixture.py --scale 0.083 --output tests/fixtures/cja_snapshot_small.json
          uv run python scripts/generate_large_fixture.py --scale 0.417 --output tests/fixtures/cja_snapshot_medium.json
          uv run python scripts/generate_large_fixture.py
          uv run python scripts/generate_aa_large_fixture.py
          uv run python scripts/generate_large_fixture.py --scale 1.67 --output tests/fixtures/cja_snapshot_xl.json

      - name: Browser functional tests
        run: uv run pytest -n auto tests/test_browser_functional.py tests/test_lineage_browser.py -v

      - name: Lineage performance gate
        run: uv run python scripts/perf_lineage_poc.py

      - name: Browser performance gate
        run: uv run python scripts/perf_browser_check.py

  build:
    needs: browser-perf
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev --group browser

      - name: Verify Python runtime
        run: |
          uv run python - <<'PYTHON'
          import os
          import sys

          expected = tuple(map(int, os.environ["UV_PYTHON"].split(".")))
          actual = sys.version_info[:2]
          print(f"Requested Python {os.environ['UV_PYTHON']}; running {sys.version}", flush=True)
          if actual != expected:
              raise SystemExit(f"Python version mismatch: expected {expected}, got {actual}")
          PYTHON

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest -n auto --ignore=tests/test_browser_functional.py --ignore=tests/test_lineage_browser.py --cov=sdr_visualizer --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=99

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(uv run python -c 'from sdr_visualizer import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Performance gate
        run: |
          uv run python scripts/generate_large_fixture.py --scale 0.083 --output tests/fixtures/cja_snapshot_small.json
          uv run python scripts/generate_large_fixture.py --scale 0.417 --output tests/fixtures/cja_snapshot_medium.json
          uv run python scripts/generate_large_fixture.py --scale 1.67 --output tests/fixtures/cja_snapshot_xl.json
          uv run python scripts/perf_check.py

      - name: Remove generated fixtures before packaging
        # pytest/conftest and the gate above materialize multi-MB fixtures
        # under tests/fixtures/; make sure none of them leak into the sdist.
        run: |
          rm -f tests/fixtures/cja_snapshot_small.json \
                tests/fixtures/cja_snapshot_medium.json \
                tests/fixtures/cja_snapshot_xl.json \
                tests/fixtures/cja_snapshot_large.json \
                tests/fixtures/aa_snapshot_large.json

      - name: Build distributions
        run: uv build --out-dir dist/packages

      - name: Install browsers
        run: uv run playwright install --with-deps chromium webkit

      - name: Smoke installed artifacts
        run: uv run python scripts/package_smoke_check.py dist/packages/ --browser

      - name: Generate SHA256SUMS
        run: cd dist/packages && sha256sum -- *.whl *.tar.gz > ../SHA256SUMS

      - name: Store verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Trusted publishing: the pypi.org pending publisher names this
    # workflow and this environment. No token is stored anywhere; the
    # OIDC id-token below is the whole credential.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Fetch distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Verify distribution digests
        run: cd dist/packages && sha256sum -c ../SHA256SUMS

      - name: Upload distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/packages/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist

      - name: Verify distribution digests
        run: cd dist/packages && sha256sum -c ../SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
