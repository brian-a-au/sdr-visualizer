name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run --locked ruff check

      - name: Ruff format
        run: uv run --locked ruff format --check

      - name: Markdown links
        run: uv run --locked python scripts/check_markdown_links.py
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Verify lockfile is in sync
        run: uv lock --check
  # Job id stays `check`: branch protection requires it by that name.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pyproject, __init__, and uv.lock agree
        run: |
          python3 - <<'EOF'
          import re, sys, tomllib

          def fail(msg):
              print(f"version-sync: {msg}")
              sys.exit(1)

          try:
              py = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          except (OSError, KeyError, tomllib.TOMLDecodeError):
              fail("could not read [project].version from pyproject.toml")

          m = re.search(
              r'__version__ = "([^"]+)"',
              open("src/sdr_visualizer/__init__.py").read(),
          )
          if not m:
              fail("could not locate __version__ in src/sdr_visualizer/__init__.py — update the pattern in .github/workflows/lint.yml")
          init = m.group(1)

          m = re.search(
              r'name = "sdr-visualizer"\nversion = "([^"]+)"',
              open("uv.lock").read(),
          )
          if not m:
              fail("could not locate sdr-visualizer's version in uv.lock — update the pattern in .github/workflows/lint.yml")
          lock = m.group(1)

          print(f"pyproject={py} __init__={init} uv.lock={lock}")
          if not (py == init == lock):
              fail(f"version drift: pyproject={py} __init__={init} uv.lock={lock}")
          print("versions in sync")
          EOF
