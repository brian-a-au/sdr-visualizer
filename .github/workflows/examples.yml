name: examples

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Regenerate examples
        run: uv run python scripts/generate_examples.py

      - name: Verify examples render
        run: |
          test -s examples/cja-typical.html
          test -s examples/aa-typical.html
          head -1 examples/cja-typical.html | grep -qi '^<!doctype html>'
          head -1 examples/aa-typical.html | grep -qi '^<!doctype html>'

      - name: Verify examples are current
        run: git diff --exit-code -- examples/
