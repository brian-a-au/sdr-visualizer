name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --all-extras --dev

      - name: Regenerate examples
        run: uv run python scripts/generate_examples.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp examples/cja-typical.html examples/aa-typical.html _site/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>sdr-visualizer — static CJA and AA implementation reports</title>
            <style>
              body { font-family: Georgia, serif; max-width: 640px; margin: 80px auto; padding: 0 24px; color: #1a1a1a; background: #fafaf7; line-height: 1.6; }
              a { color: #1a1a1a; }
              .sub { color: #6b6b66; font-size: 0.9em; }
              code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #ecece7; padding: 0.15em 0.35em; }
            </style>
          </head>
          <body>
            <h1>sdr-visualizer</h1>
            <p>Turn Adobe Customer Journey Analytics and Adobe Analytics SDR snapshots
            into a searchable catalog, reference graph, and optional change or trend
            report. The result is one self-contained HTML file.</p>
            <h2>Install</h2>
            <p><code>uv tool install sdr-visualizer</code></p>
            <p>See <a href="https://pypi.org/project/sdr-visualizer/">PyPI</a> for the
            latest released package and supported Python version.</p>
            <h2>Examples</h2>
            <p>These reports are generated from bundled synthetic fixtures:</p>
            <ul>
              <li><a href="cja-typical.html">CJA example report</a> <span class="sub">(Customer Journey Analytics)</span></li>
              <li><a href="aa-typical.html">AA example report</a> <span class="sub">(Adobe Analytics)</span></li>
            </ul>
            <p class="sub">Examples track the current <code>main</code> branch and may
            be ahead of the latest PyPI release. PyPI is the authority for released
            versions.</p>
            <h2>Project links</h2>
            <ul>
              <li><a href="https://github.com/brian-a-au/sdr-visualizer#documentation">Documentation</a></li>
              <li><a href="https://github.com/brian-a-au/sdr-visualizer">Repository</a></li>
              <li><a href="https://github.com/brian-a-au/sdr-visualizer/blob/main/CHANGELOG.md">Changelog</a></li>
              <li><a href="https://github.com/brian-a-au/sdr-visualizer/issues">Usage help and bug reports</a></li>
              <li><a href="https://github.com/brian-a-au/sdr-visualizer/blob/main/SECURITY.md">Report a security vulnerability</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
